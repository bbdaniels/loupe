name: Helpers
options:
  bundleIdPrefix: com.bbdaniels.loupe
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

# Code the Loupe helpers share (LoupeHUD and Loupe Launcher).
packages:
  LoupeKit:
    path: LoupeKit

targets:
  LoupeHUD:
    type: application
    platform: macOS
    sources:
      - path: LoupeHUD
        excludes:
          - "**/*.entitlements"
    resources:
      - path: LoupeHUD/Resources/ntfy-notify.sh
    dependencies:
      - sdk: CoreText.framework
      - package: LoupeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bbdaniels.loupe.hud
        PRODUCT_NAME: LoupeHUD
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Written by hand, not generated: it declares the .loupeedit document
        # type (EditRequest) and the loupe:// URL scheme (SessionLink).
        INFOPLIST_FILE: LoupeHUD/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LoupeHUD/Resources/LoupeHUD.entitlements
        CODE_SIGN_IDENTITY: "Loupe Dev"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO

  # Loupe Launcher: the application launcher (Option-Space) and Magnet's
  # window snapping, nested in Loupe.app/Contents/Helpers and supervised by
  # Loupe (wezterm-gui helpers.rs). Built by loupe-build.sh.
  LoupeLauncher:
    type: application
    platform: macOS
    sources:
      - path: LoupeLauncher
        excludes:
          - Info.plist
    dependencies:
      - package: LoupeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bbdaniels.loupe.launcher
        PRODUCT_NAME: "Loupe Launcher"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: LoupeLauncher/Info.plist
        CODE_SIGN_IDENTITY: "Loupe Dev"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO
    scheme: {}

  # Unit tests for the pure, Foundation-only logic. No host app: the bundle
  # compiles the sources it tests directly, so tests never launch LoupeHUD.
  # Run: xcodebuild test -scheme HelpersTests
  HelpersTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HelpersTests
      - path: LoupeHUD/Services/ClaudeProcessClassifier.swift
      - path: LoupeHUD/Services/VaultProjectTree.swift
      - path: LoupeHUD/Services/ActiveTasks.swift
      - path: LoupeHUD/Services/VaultAccess.swift
      - path: LoupeHUD/Services/TranscriptHead.swift
      - path: LoupeHUD/Services/SessionFiling.swift
      - path: LoupeHUD/Services/SessionHost.swift
      - path: LoupeHUD/Services/SessionScan.swift
      - path: LoupeHUD/Services/IMacLauncher.swift
      - path: LoupeHUD/Services/SessionLink.swift
      - path: LoupeHUD/Services/PanelToggle.swift
      - path: LoupeHUD/Services/HostProcs.swift
      - path: LoupeHUD/Services/WezTermService.swift
      - path: LoupeHUD/Services/EditRequest.swift
      - path: LoupeHUD/Services/RemoteControlReload.swift
      - path: LoupeHUD/Services/MenuBarHiding.swift
      - path: LoupeHUD/Services/DictationLight.swift
      - path: LoupeHUD/Views/StripHosting.swift
      - path: LoupeHUD/Services/PanelPlacement.swift
      - path: LoupeHUD/Services/SecurityTool.swift
      - path: LoupeLauncher/AppMatcher.swift
      - path: LoupeLauncher/SnapLayout.swift
      - path: LoupeLauncher/HotKeyCenter.swift
      - path: LoupeLauncher/WindowMover.swift
    dependencies:
      - package: LoupeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bbdaniels.loupe.hud.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
    scheme:
      testTargets:
        - HelpersTests
